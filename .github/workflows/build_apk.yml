name: Build Flet APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Flet and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flet==0.25.2"
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Rename app file for build
        run: |
          if [ -f simplex_app.py ]; then cp simplex_app.py main.py; fi

      - name: Build APK
        env:
          FLET_NO_PROMPT: "true"
        run: flet build apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: simplex-app-apk
          path: |
            build/apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk
            **/app-release.apk
